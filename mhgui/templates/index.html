<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        async></script>
    <script src="{{ url_for('static', filename='index.js') }}" async></script>
    <title>MHGU Item Search</title>
</head>

<body>
    <div class="m-3">
        <h1 class="mb-3">MHGUi Item Search Alpha</h1>
        <form>
            <div class="mb-3">
                <label for="item-search" class="form-label">Text</label>
                <input class="form-control" id="item-search" type="text" list="item-suggestions" />
            </div>
            <div class="mb-3">
                <label class="form-label">Exclude</label>
                <div class="form-check">
                    <input class="form-check-input exclude-check" type="checkbox" value="Supply"
                        id="exclude-supply-check" checked />
                    <label class="form-check-label" for="exclude-supply-check">
                        Supply Items
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input exclude-check" type="checkbox" value="Event" id="exclude-event-check"
                        checked />
                    <label class="form-check-label" for="exclude-event-check">
                        Event Rewards
                    </label>
                </div>
            </div>
        </form>
        <div id="item-results">
        </div>
    </div>
</body>

</html>
