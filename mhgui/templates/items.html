<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        async></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}" async></script>
    <title>MHGU Item Search</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}" height=40 width=160></img>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/items">items</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monsters">monsters</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/armor">armor</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="main-wrapper">
        <form>
            <div class="mb-3">
                <input class="form-control" id="item-search" type="text" list="item-suggestions" />
            </div>
            <div class="mb-3">
                <div class="btn-group" id="type-select" role="group" aria-label="Basic radio toggle button group">
                    <input type="radio" class="btn-check" name="btnradio" id="items-radio" value="items">
                    <label class="btn btn-outline-primary" for="items-radio">Items</label>

                    <input type="radio" class="btn-check" name="btnradio" id="materials-radio" value="materials">
                    <label class="btn btn-outline-primary" for="materials-radio">Materials</label>

                    <input type="radio" class="btn-check" name="btnradio" id="both-radio" value="both" checked>
                    <label class="btn btn-outline-primary" for="both-radio">All</label>
                </div>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input exclude-check" type="checkbox" value="Supply Items"
                        id="exclude-supply-check" checked />
                    <label class="form-check-label" for="exclude-supply-check">
                        Exclude Supply Items
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input exclude-check" type="checkbox" value="Event Rewards"
                        id="exclude-event-check" checked />
                    <label class="form-check-label" for="exclude-event-check">
                        Exclude Event Rewards
                    </label>
                </div>
            </div>
        </form>
        <div class="my-1 border-bottom border-secondary opacity-25"></div>
        <div id="item-results">
        </div>
    </div>
</body>

</html>
