<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Fira+Sans:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% if is_dev %}
    <script type="module" src="http://localhost:5173/@vite/client"></script>
    {% endif %}

    <title>MHGUi</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='img/logo.png') }}" height=40 width=160></img>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" id="items-view" aria-current="page" href="/items">items</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="skills-view" href="/skills">skills</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="main-wrapper">
        {% block content %}{% endblock %}
    </div>
    {{ vite_tag('main.ts') | safe }}
</body>

</html>
