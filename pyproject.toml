[project]
name = "mhgui"
version = "0.1.0"
description = "Simple GUI for browsing MHGU game dat."
authors = [
    {name = "Patrick Fant",email = "patfantmusic@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "duckdb (>=1.5.0,<2.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
